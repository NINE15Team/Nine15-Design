<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cow Cuts Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #232323;
    --muted: #4a4640;
    --soft: #5f5a52;
    --cream: #f2ede9;
    --line: #e4ded6;
    --stage: #c5a46d;
    --serif: "New York", "Iowan Old Style", Baskerville, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: Jost, system-ui, sans-serif; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .note-bar { background: var(--cream); color: var(--soft); font-size: 13px; text-align: center; padding: 10px 16px; }
  .note-bar strong { color: var(--ink); font-weight: 600; }

  .cuts { max-width: 1100px; margin: 0 auto; padding: 64px 24px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .cuts__head { text-align: center; display: flex; flex-direction: column; gap: 12px; }
  .cuts__title { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 40px; line-height: 1.1; letter-spacing: 0.04em; text-transform: uppercase; }
  .cuts__intro { margin: 0; font-size: 17px; line-height: 1.5; color: var(--muted); }
  .cuts__intro .m { display: none; }

  .stage { position: relative; width: 100%; max-width: 1040px; aspect-ratio: 920 / 600; background: var(--stage); }
  .stage__clip { position: absolute; inset: 0; overflow: hidden; }
  .stage img { position: absolute; width: 130.4348%; left: -19.5652%; top: -13.3333%; height: auto; display: block; pointer-events: none; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .stage polygon { fill: #fff; fill-opacity: 0; transition: fill-opacity 0.25s ease; }
  .stage polygon.is-active { fill-opacity: 0.4; }

  .pin { position: absolute; z-index: 2; width: 44px; height: 44px; margin: -22px 0 0 -22px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .pin span { display: block; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); border: 6px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,0.45); transition: all 0.2s ease; }
  .pin:hover span { transform: scale(1.15); }
  .pin.is-active span { width: 32px; height: 32px; border-width: 9px; box-shadow: 0 0 0 6px rgba(255,255,255,0.35), 0 2px 8px rgba(0,0,0,0.45); }

  .pop { position: absolute; z-index: 3; width: 300px; background: #fff; padding: 22px 24px 18px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 18px 50px rgba(0,0,0,0.25); }
  .pop[hidden] { display: none; }
  .pop__top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .pop h3 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 22px; line-height: 1.2; letter-spacing: 0.03em; text-transform: uppercase; }
  .pop__x { flex: none; width: 32px; height: 32px; margin: -6px -8px 0 0; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: var(--soft); cursor: pointer; padding: 0; }
  .pop__x svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .pop p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--soft); }
  .pop ul { margin: 4px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  .pop li { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 16px; }

  /* Mobile-only parts */
  .tiles, .panel { display: none; }
  .tile { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px 16px; border-radius: 14px; background: #f4f2ef; border: 1.5px solid #e7e2db; cursor: pointer; text-align: left; flex: 0 0 auto; min-width: 132px; scroll-snap-align: start; }
  .tile__name { font-size: 15px; font-weight: 500; line-height: 1.2; white-space: nowrap; }
  .tile svg { width: 22px; height: 22px; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tile .i-check { display: none; stroke: var(--ink); }
  .tile .i-plus { stroke: #8a847b; }
  .tile[aria-pressed="true"] { background: #fff; border-color: var(--ink); }
  .tile[aria-pressed="true"] .i-check { display: block; }
  .tile[aria-pressed="true"] .i-plus { display: none; }
  .panel h3 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 24px; line-height: 1.2; letter-spacing: 0.03em; text-transform: uppercase; }
  .panel__blurb { margin: 0; font-size: 15px; line-height: 1.45; color: var(--soft); }
  .panel__list { margin: 6px 0 0; font-size: 19px; line-height: 1.5; }

  @media (max-width: 749px) {
    .cuts { padding: 36px 16px 40px; gap: 24px; align-items: stretch; }
    .cuts__title { font-size: 26px; }
    .cuts__intro { font-size: 15px; }
    .cuts__intro .d { display: none; }
    .cuts__intro .m { display: inline; }
    .pin span { width: 20px; height: 20px; border-width: 5px; }
    .pin.is-active span { width: 28px; height: 28px; border-width: 8px; }
    .pop { display: none !important; }
    .tiles { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; margin: 0 -16px; padding: 2px 16px; scroll-padding-left: 16px; scrollbar-width: none; }
    .tiles::-webkit-scrollbar { display: none; }
    .panel { display: flex; flex-direction: column; gap: 8px; padding: 4px 8px 0; }
  }
</style>
</head>
<body>
<div class="note-bar"><strong>Design concept</strong> · Homepage cow section · Try it on desktop and on your phone</div>

<section class="cuts" aria-labelledby="cuts-title">
  <div class="cuts__head">
    <h2 class="cuts__title" id="cuts-title">Every cut in a cow share</h2>
    <p class="cuts__intro"><span class="d">Click</span><span class="m">Tap</span> a section of the cow to see the cuts it gives you.</p>
  </div>

  <div class="stage" id="stage">
    <div class="stage__clip">
      <img src="https://www.primewagyufarm.com/cdn/shop/files/cowanatomy1.png?width=1400" alt="Illustration of a Wagyu steer divided into sections" width="1200" height="800">
      <svg viewBox="180 80 920 600" preserveAspectRatio="none" aria-hidden="true" id="regions"></svg>
    </div>
    <div class="pop" id="pop" role="dialog" aria-labelledby="popName" hidden>
      <div class="pop__top">
        <h3 id="popName"></h3>
        <button class="pop__x" type="button" id="popClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <p id="popBlurb"></p>
      <ul id="popList"></ul>
    </div>
  </div>

  <div class="tiles" id="tiles" role="group" aria-label="Cow sections"></div>

  <div class="panel" id="panel" aria-live="polite">
    <h3 id="pName"></h3>
    <p class="panel__blurb" id="pBlurb"></p>
    <p class="panel__list" id="pList"></p>
  </div>
</section>

<script>
(function () {
  var AREAS = [
    { name: 'Round', x: 280, y: 300, points: '262,138 352,145 350,380 345,432 300,470 262,540 228,470 210,300 222,175', blurb: 'Lean roasts for low and slow cooking', cuts: ['Rump Roast', 'Eye of Round'] },
    { name: 'Sirloin', x: 405, y: 262, points: '352,145 472,152 457,374 350,380', blurb: 'Bold steaks and the prized picanha', cuts: ['Top Sirloin', 'Tri-Tip', 'Picanha'] },
    { name: 'Short Loin', x: 518, y: 262, points: '472,152 582,157 572,362 457,374', blurb: 'The most tender steaks', cuts: ['New York Strip', 'Filet Mignon'] },
    { name: 'Rib', x: 648, y: 262, points: '582,157 722,165 710,357 572,362', blurb: 'Rich marbling, deep flavor', cuts: ['Ribeye', 'Back Ribs'] },
    { name: 'Chuck', x: 805, y: 255, points: '722,165 895,155 902,310 872,364 710,357', blurb: 'Distinctive cuts worth discovering', cuts: ['Denver', 'Flat Iron', 'Chuck Eye', 'Chuck Roast'] },
    { name: 'Plate & Flank', x: 520, y: 425, points: '350,380 702,364 684,474 600,470 520,478 440,470 380,446 345,432', blurb: 'Fast-cooking steaks for the grill', cuts: ['Short Ribs', 'Hanger', 'Skirt', 'Flank', 'Bavette'] },
    { name: 'Brisket & Shank', x: 778, y: 430, points: '702,364 872,364 862,440 805,470 800,545 692,545 684,474', blurb: 'Made for smoking and braising', cuts: ['Brisket', 'Osso Buco'] }
  ];
  var SVGNS = 'http://www.w3.org/2000/svg';
  var stage = document.getElementById('stage');
  var regions = document.getElementById('regions');
  var tiles = document.getElementById('tiles');
  var pop = document.getElementById('pop');
  var mq = window.matchMedia('(max-width: 749px)');
  var current = 4;
  var popOpen = false;

  var ICONS = '<svg class="i-plus" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 8v8M8 12h8"/></svg>' +
              '<svg class="i-check" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M8 12.4l2.7 2.6L16 9.6"/></svg>';

  AREAS.forEach(function (a, i) {
    var poly = document.createElementNS(SVGNS, 'polygon');
    poly.setAttribute('points', a.points);
    regions.appendChild(poly);
    a.poly = poly;

    var pin = document.createElement('button');
    pin.type = 'button';
    pin.className = 'pin';
    pin.setAttribute('aria-label', 'Show ' + a.name + ' cuts');
    pin.style.left = ((a.x - 180) / 920 * 100) + '%';
    pin.style.top = ((a.y - 80) / 600 * 100) + '%';
    pin.appendChild(document.createElement('span'));
    pin.addEventListener('click', function () { onPin(i); });
    stage.appendChild(pin);
    a.pin = pin;

    var tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'tile';
    tile.setAttribute('aria-controls', 'panel');
    var nm = document.createElement('span');
    nm.className = 'tile__name';
    nm.textContent = a.name;
    tile.appendChild(nm);
    tile.insertAdjacentHTML('beforeend', ICONS);
    tile.addEventListener('click', function () { select(i); });
    tiles.appendChild(tile);
    a.tile = tile;
  });

  function onPin(i) {
    if (mq.matches) { select(i); scrollPanel(); return; }
    if (popOpen && current === i) { closePop(); return; }
    current = i;
    popOpen = true;
    render();
  }
  function select(i) { current = i; render(); }
  function closePop() { popOpen = false; render(); }
  function scrollPanel() {
    var p = document.getElementById('panel');
    var r = p.getBoundingClientRect();
    if (r.top > window.innerHeight - 120) p.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function render() {
    var mobile = mq.matches;
    var a = AREAS[current];
    var highlight = mobile || popOpen;
    AREAS.forEach(function (o, j) {
      var on = highlight && j === current;
      o.poly.classList.toggle('is-active', on);
      o.pin.classList.toggle('is-active', on);
      o.pin.setAttribute(mobile ? 'aria-pressed' : 'aria-expanded', on ? 'true' : 'false');
      o.pin.removeAttribute(mobile ? 'aria-expanded' : 'aria-pressed');
      o.tile.setAttribute('aria-pressed', j === current ? 'true' : 'false');
    });
    document.getElementById('pName').textContent = a.name;
    document.getElementById('pBlurb').textContent = a.blurb;
    document.getElementById('pList').textContent = a.cuts.join(' · ');
    if (mobile) tiles.scrollTo({ left: Math.max(0, a.tile.offsetLeft - 16), behavior: 'smooth' });

    if (!mobile && popOpen) {
      document.getElementById('popName').textContent = a.name;
      document.getElementById('popBlurb').textContent = a.blurb;
      var ul = document.getElementById('popList');
      ul.textContent = '';
      a.cuts.forEach(function (c) { var li = document.createElement('li'); li.textContent = c; ul.appendChild(li); });
      pop.hidden = false;
      var W = stage.clientWidth, H = stage.clientHeight, PW = pop.offsetWidth, PH = pop.offsetHeight;
      var cx = (a.x - 180) / 920 * W, cy = (a.y - 80) / 600 * H;
      var left = a.x >= 700 ? cx - 34 - PW : cx + 34;
      left = Math.max(8, Math.min(W - PW - 8, left));
      var top = Math.max(16, Math.min(H - PH - 16, cy - 50));
      pop.style.left = left + 'px';
      pop.style.top = top + 'px';
    } else {
      pop.hidden = true;
    }
  }

  document.getElementById('popClose').addEventListener('click', closePop);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && popOpen) closePop(); });
  window.addEventListener('resize', render);
  if (mq.addEventListener) mq.addEventListener('change', render);
  popOpen = !mq.matches;
  render();
})();
</script>
</body>
</html>
